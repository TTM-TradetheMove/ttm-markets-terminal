<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="../img/lens-192.png"><title>TTM LENS</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b0b0c"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="TTM LENS"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="../img/lens-180.png">
<style>
:root{--bg:#0b0b0c;--card:#121214;--line:#2a2a2e;--text:#e8e6e1;--mute:#9a968c;--gold:#dba118;--gold2:#f2c14e;--panel:#16161a}
#ttmChatBtn,#ttmCommBtn,#ttmLive{display:none!important}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#gate{max-width:440px;margin:14vh auto;padding:0 20px;text-align:center}#gate img{height:54px}#gate h1{font-size:20px;margin:14px 0 6px}#gate p{color:var(--mute)}
#gate button{background:transparent;border:1px solid var(--gold);color:var(--gold2);border-radius:999px;padding:9px 18px;font:inherit;font-weight:700;cursor:pointer}
</style></head>
<body data-terminal="charts">
<div id="gate"><img src="../img/lens-192.png" alt="TTM LENS" style="height:84px;border-radius:20px"><h1>TTM LENS</h1><p id="gMsg">Checking your account…</p><button id="gBtn" style="display:none"></button></div>
<script src="../chartpro.js?v=2"></script>
<script src="../ttmcharts.js?v=43"></script>
<script src="../ttmind.js?v=13"></script>
<script src="../ttmpaper.js?v=13"></script>
<script src="../accounts.js?v=1794624974"></script>
<script>
(function(){
  const q = new URLSearchParams(location.search), g = id => document.getElementById(id);
  let n = 0, started = false;
  function go(){
    if(started) return; const w = window.ttmWho ? window.ttmWho() : {ready: false};
    if(!w.ready){ if(++n < 150) return setTimeout(go, 100); g('gMsg').textContent = 'Could not check your account. Refresh this window.'; return; }
    let has = false; try{ has = !!localStorage.getItem('ttm_auth_v1'); }catch(e){} if(!w.user && (window.__m = (window.__m || 0) + 1) < (has ? 260 : 40)) return setTimeout(go, 150); if(!w.user){ g('gMsg').textContent = 'Sign in with your TTM account to open TTM LENS.'; g('gBtn').textContent = 'Sign in'; g('gBtn').style.display = ''; g('gBtn').onclick = () => { const b = g('acctBtn'); if(b) b.click(); else location.href = '../index.html'; }; return setTimeout(go, 1500); }
    if(!(w.admin || w.lens)){ if(!w.lensReady && ++n < 150) return setTimeout(go, 100); g('gMsg').innerHTML = 'TTM LENS needs a yearly LENS pass. Open your Account on the TTM terminal to get yours.'; g('gBtn').style.display = 'none'; return; }
    started = true; g('gate').remove(); ttmChartsOpen({embedded: true, pane: q.get('pane'), ex: q.get('ex'), sym: q.get('sym'), tf: q.get('tf')});
  }
  go();
})();
</script>
</body></html>
