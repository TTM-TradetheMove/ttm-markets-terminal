name: Update stock screener

on:
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/update_screener.py

permissions:
  contents: write

concurrency:
  group: update-screener
  cancel-in-progress: false

jobs:
  screener:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build screener data
        run: timeout 15m python3 -u scripts/update_screener.py || echo "failed; keeping previous"
      - name: Commit
        run: |
          git config user.name "ttm-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add screener_us.json 2>/dev/null || true
          git add screener_us_status.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Auto-update screener data"
            for i in 1 2 3 4; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
          fi
