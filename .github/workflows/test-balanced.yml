name: Test BTC balanced price

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/balanced_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: balanced-test
          path: /tmp/balanced_test.json
