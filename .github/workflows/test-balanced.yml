name: Test BTC balanced price

on:
  workflow_dispatch: {}
  push:
    paths:
      - scripts/balanced_test.py

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/balanced_test.py 2>&1 | tee balanced_test_output.txt
      - name: Commit output
        run: |
          git config user.name "ttm-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add balanced_test_output.txt
          git commit -m "Balanced test output" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
      - uses: actions/upload-artifact@v4
        with:
          name: balanced-test
          path: /tmp/balanced_test.json
