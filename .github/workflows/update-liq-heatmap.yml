name: Update liquidation heatmap

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch: {}
  push:
    paths:
      - scripts/update_liq_heatmap.py
      - .github/workflows/update-liq-heatmap.yml

permissions:
  contents: write

concurrency:
  group: update-liq-heatmap
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build modelled liquidation heatmap (Binance / Bybit open interest + candles)
        continue-on-error: true
        run: python3 scripts/update_liq_heatmap.py

      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "ttm-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f liq_heatmap_debug.txt 2>/dev/null || true
          git add liq_heatmap_data.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update liquidation heatmap"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi
