name: Update RSI heatmap

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
  push:
    paths:
      - scripts/update_rsi.py

permissions:
  contents: write

concurrency:
  group: update-rsi
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch RSI data
        run: python3 scripts/update_rsi.py

      - name: Commit and push if changed
        run: |
          git config user.name "ttm-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rsi_heatmap.json 2>/dev/null || true
          git add -f rsi_debug.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to rsi_heatmap.json"
          else
            git commit -m "Auto-update RSI heatmap"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi
