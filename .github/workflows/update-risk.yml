name: Update risk charts

on:
  schedule:
    - cron: "41 3,15 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - scripts/update_risk.py

permissions:
  contents: write

concurrency:
  group: update-risk
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch risk charts
        run: python3 scripts/update_risk.py

      - name: Commit and push if changed
        run: |
          git config user.name "ttm-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add risk_data.json risk_data_status.json cycle_signals.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to risk_data.json"
          else
            git commit -m "Auto-update risk charts"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi
