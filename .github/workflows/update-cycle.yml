name: Update liquidity cycle

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/update_cycle.py

permissions:
  contents: write

concurrency:
  group: update-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build liquidity cycle
        run: python3 scripts/update_cycle.py
      - name: Commit
        run: |
          git config user.name "ttm-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add liquidity_cycle.json cycle_debug.txt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-update liquidity cycle"
            for i in 1 2 3 4; do
              git pull --rebase -X theirs origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi
