name: Telegram session announcer

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a test message instead of normal alerts"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: telegram-sessions
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Announce session events
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          TELEGRAM_SESSIONS_THREAD_ID: ${{ secrets.TELEGRAM_SESSIONS_THREAD_ID }}
          INCLUDE_WEEKENDS: "0"
          SEND_TEST: ${{ inputs.send_test && '1' || '0' }}
        run: python3 scripts/telegram_sessions.py

      - name: Save state
        if: always()
        run: |
          git config user.name "ttm-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add telegram_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Telegram announcer state"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          fi
