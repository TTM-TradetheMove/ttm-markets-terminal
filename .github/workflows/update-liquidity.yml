name: Update TradFi liquidity

on:
  schedule:
    - cron: "25 6,18 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/update_liquidity.py
      - scripts/tf_common.py

permissions:
  contents: write

concurrency:
  group: update-liquidity
  cancel-in-progress: false

jobs:
  liquidity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build liquidity data
        run: timeout 12m python3 -u scripts/update_liquidity.py || echo "failed; keeping previous"
      - name: Commit
        run: |
          git config user.name "ttm-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tradfi_liquidity.json 2>/dev/null || true
          git add tradfi_liquidity_status.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Auto-update TradFi liquidity"
            for i in 1 2 3 4; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
          fi
