name: Update Crypto Rotation data

on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/update_crypto_rotation.py

permissions:
  contents: write

concurrency:
  group: update-crypto-rotation
  cancel-in-progress: false

jobs:
  crypto-rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build rotation data
        env:
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
        run: timeout 38m python3 -u scripts/update_crypto_rotation.py || echo "stopped early"
      - name: Commit
        run: |
          git config user.name "ttm-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crypto_rotation_status.json 2>/dev/null; git add crypto_rotation.json 2>/dev/null || echo "no crypto_rotation.json was produced (data source unavailable)"
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-update crypto rotation data"
            for i in 1 2 3 4; do
              git pull --rebase -X theirs origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi
