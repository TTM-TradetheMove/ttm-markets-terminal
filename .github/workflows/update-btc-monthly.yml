name: Update BTC monthly returns

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - scripts/update_btc_monthly.py

permissions:
  contents: write

concurrency:
  group: update-btc-monthly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch BTC monthly history
        run: python3 scripts/update_btc_monthly.py

      - name: Commit and push if changed
        run: |
          git config user.name "ttm-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add btc_monthly.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to btc_monthly.json"
          else
            git commit -m "Auto-update BTC monthly returns"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi
