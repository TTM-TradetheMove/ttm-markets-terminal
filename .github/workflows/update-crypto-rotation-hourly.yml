name: Update Crypto Rotation hourly data

on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/update_crypto_rotation_h.py
      - scripts/update_crypto_rotation.py

permissions:
  contents: write

concurrency:
  group: update-crypto-rotation
  cancel-in-progress: false

jobs:
  crypto-rotation-hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build hourly rotation data
        env:
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
        run: timeout 35m python3 -u scripts/update_crypto_rotation_h.py || echo "stopped early"
      - name: Commit
        run: |
          git config user.name "ttm-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crypto_rotation_h.json crypto_rotation_h_status.json 2>/dev/null || echo "nothing produced"
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-update crypto rotation hourly data"
            for i in 1 2 3 4; do
              git pull --rebase -X theirs origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi
