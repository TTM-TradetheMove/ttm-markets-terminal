name: Update Crypto Market history

on:
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/update_market_history.py

permissions:
  contents: write

concurrency:
  group: update-market-history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build long history
        run: python3 -u scripts/update_market_history.py
      - name: Commit
        run: |
          git config user.name "ttm-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crypto_market_history.json crypto_market_history_status.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-update crypto market history"
            for i in 1 2 3 4; do
              git pull --rebase -X theirs origin main && git push && break
              sleep 5
            done
          fi
