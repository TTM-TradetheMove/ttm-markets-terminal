name: Update market data (Fear & Greed + funding/OI)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Fear & Greed index
        run: python3 scripts/update_fear_greed.py

      - name: Fetch funding rates / open interest
        run: python3 scripts/update_funding.py

      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "ttm-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f funding_debug.txt 2>/dev/null || true
          git add fear_greed_data.json funding_data.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update market data (Fear & Greed, funding/OI)"
            git push
          fi
