name: Daily market brief

on:
  schedule:
    # 20:05 and 21:05 UTC (summer / winter): the script only sends in the 7am hour Melbourne time (summer and winter)
    - cron: "5 20 * * *"
    - cron: "5 21 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send now even if it is not 7am in Melbourne (testing)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write the brief
        env:
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python3 scripts/daily_brief.py
      - name: Save brief
        if: always()
        run: |
          git config user.name "ttm-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add daily_brief.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily brief"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          fi
