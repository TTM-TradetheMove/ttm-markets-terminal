name: Test ASX data sources

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/test_asx.py

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -u scripts/test_asx.py
      - name: Commit result
        run: |
          git config user.name "ttm-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tradfi_asx_test.json
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "ASX data test result"
            for i in 1 2 3 4; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
          fi
