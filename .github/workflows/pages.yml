name: Deploy site to Pages

# One deployment at a time, and the newest commit always wins:
#  - the "pages" concurrency group queues runs (one running, one waiting; older waiting ones are replaced)
#  - it never cancels a deployment that is already running, so none overlap
# Triggers: a push to main (any change by hand), and whenever a data job finishes (bots push with the built-in token,
# which does not fire push triggers, so we listen for the jobs completing instead).
# Telegram jobs are not listed: they only save state files, not site content.

on:
  push:
    branches: [main]
    paths-ignore:
      - "telegram_*_state.json"
      - "*_debug.txt"
      - "debug_ff.*"
  workflow_run:
    workflows:
      - "Update crypto bias history"
      - "Update BTC monthly returns"
      - "Update BTC price history"
      - "Update economic calendar"
      - "Update liquidation heatmap"
      - "Update liquidation map"
      - "Update market data (Fear & Greed + funding/OI)"
      - "Update RSI heatmap"
      - "Update social pulse"
      - "Update token events"
      - "Update TradFi data"
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Prepare site folder (paid data lives only on ttm.markets)
        run: |
          mkdir _pages
          rsync -a --exclude '.git' --exclude '.github' --exclude '_pages' --exclude 'scripts' --exclude 'supabase' --exclude 'worker.js' --exclude 'wrangler.jsonc' --exclude '*_debug.txt' --exclude 'debug_ff.*' --exclude 'telegram_*state.json' --exclude 'tradfi_asx_test.json' --exclude 'tradfi_fund_test.json' --exclude 'token_sources_cache.json' --exclude 'tradfi_earnings.json' --exclude 'tradfi_liquidity.json' --exclude 'tradfi_corr.json' --exclude 'tradfi_commodities.json' --exclude 'screener_us.json' --exclude 'insiders_us.json' --exclude 'social_data.json' --exclude 'liquidations_data.json' --exclude 'liquidation_totals.json' --exclude 'liq_heatmap_data.json' --exclude 'funding_data.json' --exclude 'maxpain.json' ./ _pages/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - id: deployment
        uses: actions/deploy-pages@v4
