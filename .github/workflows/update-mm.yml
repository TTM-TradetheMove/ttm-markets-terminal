name: Update market maker tracker

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}
  push:
    paths:
      - scripts/update_mm.py
      - data/mm_wallets.json
      - .github/workflows/update-mm.yml

permissions:
  contents: write

concurrency:
  group: update-mm
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/update_mm.py
      - name: Commit and push if changed
        run: |
          git config user.name "ttm-mm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add mm_positions.json mm_moves.json mm_history.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-update market maker tracker"
            for i in 1 2 3 4; do
              git pull --rebase -X theirs origin main && git push && break
              sleep $((i * 5))
            done
          fi
