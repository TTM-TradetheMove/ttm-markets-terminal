name: Telegram find chat ID

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post the chat id into the chat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 scripts/telegram_find_chat.py
