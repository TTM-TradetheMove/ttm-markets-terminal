name: Debug - dump forexfactory.com calendar HTML

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch raw HTML
        run: |
          python3 - << 'PYEOF'
          import urllib.request
          req = urllib.request.Request(
              "https://www.forexfactory.com/calendar",
              headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"}
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              html = resp.read().decode("utf-8", errors="replace")
          with open("debug_ff.html", "w") as f:
              f.write(html)
          print("Saved", len(html), "bytes")
          PYEOF
      - name: Commit debug output
        run: |
          git config user.name "ttm-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add debug_ff.html
          git commit -m "Debug: dump forexfactory.com/calendar HTML" || echo "nothing to commit"
          git push
