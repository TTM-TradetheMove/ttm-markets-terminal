name: Update TradFi correlation

on:
  schedule:
    - cron: "50 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/update_corr.py
      - scripts/tf_common.py

permissions:
  contents: write

concurrency:
  group: update-corr
  cancel-in-progress: false

jobs:
  corr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build correlation data
        run: timeout 12m python3 -u scripts/update_corr.py || echo "failed; keeping previous"
      - name: Commit
        run: |
          git config user.name "ttm-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tradfi_corr.json 2>/dev/null || true
          git add tradfi_corr_status.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Auto-update TradFi correlation"
            for i in 1 2 3 4; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
          fi
