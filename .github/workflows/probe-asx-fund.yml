name: Test ASX fundamentals sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run probe
        run: python3 -u scripts/probe_asx_fund.py
      - name: Commit result
        run: |
          git config user.name "ttm-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add asx_fund_probe.json
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "ASX fundamentals source test result"
            for i in 1 2 3 4; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
          fi
