name: Update ASX snapshot

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch: {}
  push:
    paths:
      - scripts/update_asx.py
      - .github/workflows/update-asx.yml

permissions:
  contents: write

concurrency:
  group: update-asx
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build ASX snapshot
        continue-on-error: true
        timeout-minutes: 5
        run: timeout 270 python3 scripts/update_asx.py
      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "ttm-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f asx_debug.txt 2>/dev/null || true
          git add asx_snapshot.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update ASX snapshot"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi
