name: Post terminal promo to Telegram - Group 2

on:
  workflow_dispatch:
    inputs:
      topic_id:
        description: "Forum topic id (leave empty for default)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (do not send)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send promo to Group 2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_GROUP2 }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID_GROUP2 }}
          PROMO_THREAD_ID: ${{ inputs.topic_id }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python3 scripts/telegram_promo.py
