name: Update BTC realized price

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - scripts/update_realized.py

permissions:
  contents: write

concurrency:
  group: update-realized
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch BTC realized price
        run: python3 scripts/update_realized.py

      - name: Commit and push if changed
        run: |
          git config user.name "ttm-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add btc_realized.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to btc_realized.json"
          else
            git commit -m "Auto-update BTC realized price"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi
