name: Update token events

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-token-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Scrape latest token events
        run: python3 scripts/update_token_events.py

      - name: Add exchange and unlock sources
        if: always()
        run: python3 scripts/update_token_sources.py

      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "ttm-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f token_events_debug.txt token_sources_debug.txt token_sources_cache.json 2>/dev/null || true
          if git diff --quiet -- token_events_data.json && git diff --cached --quiet; then
            echo "No changes to token_events_data.json or token_events_debug.txt"
          else
            git add token_events_data.json 2>/dev/null || true
            git commit -m "Auto-update token events"
            git push
          fi
