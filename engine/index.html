<body data-terminal="engine">
<header><a class="back" href="../index.html">&larr; Terminal</a><div class="brand"><div class="logo">TTM</div><div><b>TTM Agent Console</b><small>Automated trading engine &middot; paper trading</small></div></div><button type="button" class="acct-btn" id="acctBtn">Sign in</button></header>

<script>
(function(){
const $ = id => document.getElementById(id), esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const app = $('app'); let saveMsg = '', D = null, busy = false, rng = 'all', holds = false, setOpen = null, W = null, dirty = false;
const hid = () => !!(window.ttmHid && window.ttmHid());
const usd = (v, sb, plus) => { if(hid()){ if(!(sb > 0)) return '•••'; const p = v / sb * 100; return (plus && p > 0 ? '+' : '') + p.toFixed(Math.abs(p) >= 10 ? 1 : 2) + '%'; } return (v < 0 ? '-' : plus && v > 0 ? '+' : '') + '$' + Math.abs(v).toLocaleString(undefined, {maximumFractionDigits: Math.abs(v) < 100 ? 2 : 0}); };
const px = v => v == null ? '' : v >= 1000 ? Number(v).toLocaleString(undefined, {maximumFractionDigits: 1}) : v >= 1 ? Number(v).toFixed(3) : Number(v).toPrecision(4);
const ago = t => { if(!t) return 'never'; const m = Math.round((Date.now() - new Date(t).getTime()) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago'; };
const dur = ms => { const h = ms / 3600000; return h < 1 ? Math.round(h * 60) + ' min' : h < 48 ? h.toFixed(1) + ' h' : (h / 24).toFixed(1) + ' d'; };
const A = (p, o) => window.ttmApi(p, o), Ax = async (p, p2) => { const r = await window.ttmApi(p); return r.ok ? r : window.ttmApi(p2); };
const CK = 'ttm_engine_cache_v2'; const cacheGet = () => { try{ const j = JSON.parse(localStorage.getItem(CK) || 'null'); return j && j.cfg ? j : null; }catch(e){ return null; } }, cachePut = () => { try{ if(D && D.cfg && D.closed) localStorage.setItem(CK, JSON.stringify(D)); }catch(e){} };
const TFL = [['5m', '5min', 288], ['15m', '15min', 96], ['30m', '30min', 48], ['1H', '1hr', 24], ['2H', '2hr', 12], ['4H', '4hr', 6], ['8H', '8hr', 3], ['12H', '12hr', 2], ['1D', 'daily', 1], ['3D', '3day', 0.33], ['1W', 'weekly', 0.14]];
const STR = [['trend', 'Trend continuation', 'Trades pullbacks in established trends, filtered by the higher time frame.'], ['breakout', 'Breakout and retest', 'Waits for a confirmed breakout of support or resistance, then a retest.'], ['sweep', 'Liquidity sweep and reversal', 'High priority. Price takes a high or low, rejects, and the agent trades the reversal.'], ['momentum', 'Momentum expansion', 'Rising volume and volatility, strong moves, trailing exits.']];
const MODELS = [['claude-sonnet-5-5', 'TTM Agent · Standard'], ['claude-haiku-5-5', 'TTM Agent · Lite (cheapest)'], ['claude-opus-5-5', 'TTM Agent · Max (most careful, costs most)']];
const sname = k => k ? (STR.find(x => x[0] === k) || [0, k])[1] : 'Before strategies';
// two stage load: configuration and open trades first (the top of the page shows quickly), then the history
async function load(){ if(busy) return; busy = true; try{
  const [c, o, pp] = await Promise.all([A('/rest/v1/ttm_engine_config?select=*&id=eq.1'), A('/rest/v1/ttm_engine_positions?select=*&status=eq.open&order=opened_at.desc'), A('/rest/v1/ttm_engine_proposals?select=*&status=eq.pending&order=ts.desc&limit=10')]);
  if(!c.ok){ D = {missing: true}; busy = false; paint(); return; }
  D = Object.assign(D && D.cfg ? D : {closed: null, dec: null, eq: null}, {cfg: (c.json || [])[0], open: o.json || [], props: pp.ok && Array.isArray(pp.json) ? pp.json : [], propsMissing: !pp.ok}); paint();
  const [cl, d, e, rv, sg] = await Promise.all([Ax('/rest/v1/ttm_engine_positions?select=id,pair,side,entry,exit_price,pnl,risk_usd,lev,close_reason,strategy,timeframe,opened_at,closed_at&status=eq.closed&order=closed_at.desc&limit=200', '/rest/v1/ttm_engine_positions?select=*&status=eq.closed&order=closed_at.desc&limit=200'), Ax('/rest/v1/ttm_engine_decisions?select=id,ts,pair,action,reason,accepted,reject_reason,strategy,timeframe&order=ts.desc&limit=80', '/rest/v1/ttm_engine_decisions?select=id,ts,pair,action,reason,accepted,reject_reason&order=ts.desc&limit=80'), A('/rest/v1/ttm_engine_equity?select=ts,equity&order=ts.desc&limit=600'), A('/rest/v1/ttm_engine_reviews?select=*&order=ts.desc&limit=1'), A('/rest/v1/ttm_engine_suggestions?select=*&order=ts.desc&limit=30')]);
  D.closed = cl.json || []; D.dec = d.json || []; D.eq = (e.json || []).slice().reverse(); D.revMissing = !rv.ok || !sg.ok; D.rev = (rv.ok && rv.json && rv.json[0]) || null; D.sug = sg.ok && Array.isArray(sg.json) ? sg.json : []; D.adm = !!(window.ttmWho && window.ttmWho().admin); cachePut(); }catch(err){ D = D && D.cfg ? D : {missing: true}; } busy = false; paint(); }
function locked(msg){ app.innerHTML = `<div class="card"><h1>TTM Agent Console</h1><p>${msg}</p><p class="note">Early access is for TTM and testers only while it is built.</p><p><a class="btn" style="display:inline-block;text-decoration:none;background:var(--gold);color:#16120a;border-radius:10px;padding:9px 14px;font-weight:800" href="../index.html">Back to the terminal</a></p></div>`; }
function spark(eq, col){ const a = eq.slice(-40).map(p => +p.equity); if(a.length < 2) return ''; const lo = Math.min(...a), hi = Math.max(...a), W = 74, H = 28; return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" points="${a.map((v, i) => (i / (a.length - 1) * W).toFixed(1) + ',' + (H - 3 - (v - lo) / (hi - lo || 1) * (H - 6)).toFixed(1)).join(' ')}"/></svg>`; }
function ring(p, col){ const R = 17, C = 2 * Math.PI * R; return `<svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="${R}" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="5"/><circle cx="23" cy="23" r="${R}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(C * p / 100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 23 23)"/></svg>`; }
function chart(all, start){ let eq = all; const now = Date.now(); if(rng !== 'all'){ const lim = now - (rng === '24h' ? 86400000 : 7 * 86400000); eq = all.filter(p => new Date(p.ts).getTime() >= lim); }
  if(eq.length < 2) return '<p class="note">The equity line appears once the agent has made a couple of checks in this range.</p>';
  const W = 760, H = 250, L = 58, R = 14, T = 12, B = 24, pct = hid(), val = v => pct ? (start > 0 ? (v / start - 1) * 100 : 0) : v, ys = eq.map(p => val(+p.equity)), lo = Math.min(...ys, val(start)), hi = Math.max(...ys, val(start)), pad = (hi - lo || 1) * .12;
  const t0 = new Date(eq[0].ts).getTime(), t1 = new Date(eq[eq.length - 1].ts).getTime() || t0 + 1, X = t => L + (t - t0) / (t1 - t0 || 1) * (W - L - R), Y = v => T + (1 - (v - (lo - pad)) / (hi - lo + 2 * pad)) * (H - T - B), fm = v => pct ? (v > 0 ? '+' : '') + v.toFixed(1) + '%' : '$' + Math.round(v).toLocaleString();
  const path = eq.map((p, i) => (i ? 'L' : 'M') + X(new Date(p.ts).getTime()).toFixed(1) + ' ' + Y(val(+p.equity)).toFixed(1)).join(' '), up = +eq[eq.length - 1].equity >= start, col = up ? '#3fb47a' : '#e0554d', by = Y(val(start));
  let g = `<defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>`;
  g += [0, .5, 1].map(f => { const v = lo + (hi - lo) * f, y = Y(v); return `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.07)"/><text x="${L - 6}" y="${y + 4}" font-size="10.5" fill="#9a968c" text-anchor="end">${fm(v)}</text>`; }).join('');
  g += `<line x1="${L}" x2="${W - R}" y1="${by}" y2="${by}" stroke="#dba118" stroke-dasharray="4 4" opacity=".6"/><path d="${path} L${X(t1)} ${H - B} L${X(t0)} ${H - B} Z" fill="url(#gr)"/><path d="${path}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round"/><circle cx="${X(t1)}" cy="${Y(val(+eq[eq.length - 1].equity))}" r="4.5" fill="${col}"/>`;
  const fd = t => new Date(t).toLocaleDateString(undefined, {day: 'numeric', month: 'short'}) + (rng === '24h' ? ' ' + new Date(t).toLocaleTimeString(undefined, {hour: '2-digit', minute: '2-digit'}) : ''); g += `<text x="${L}" y="${H - 6}" font-size="10.5" fill="#9a968c">${fd(t0)}</text><text x="${W - R}" y="${H - 6}" font-size="10.5" fill="#9a968c" text-anchor="end">${fd(t1)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}</svg>`; }
function stats(cl){ const n = cl.length, wins = cl.filter(x => +x.pnl > 0), loss = cl.filter(x => +x.pnl < 0), gw = wins.reduce((t, x) => t + +x.pnl, 0), gl = Math.abs(loss.reduce((t, x) => t + +x.pnl, 0));
  const hold = cl.filter(x => x.opened_at && x.closed_at).map(x => new Date(x.closed_at) - new Date(x.opened_at)), group = f => { const m = {}; cl.forEach(x => { const k = f(x); (m[k] = m[k] || []).push(x); }); return Object.keys(m).map(k => { const a = m[k], w = a.filter(x => +x.pnl > 0).length, pnl = a.reduce((t, x) => t + +x.pnl, 0), r = a.filter(x => +x.risk_usd > 0).map(x => +x.pnl / +x.risk_usd); return {k, n: a.length, w, pnl, wr: w / a.length * 100, avgR: r.length ? r.reduce((t, x) => t + x, 0) / r.length : null}; }).sort((a, b) => b.pnl - a.pnl); };
  return {n, w: wins.length, l: loss.length, wr: n ? wins.length / n * 100 : 0, pf: gl ? gw / gl : (gw ? 99 : 0), avgW: wins.length ? gw / wins.length : 0, avgL: loss.length ? -gl / loss.length : 0, best: n ? Math.max(...cl.map(x => +x.pnl)) : 0, worst: n ? Math.min(...cl.map(x => +x.pnl)) : 0, hold: hold.length ? hold.reduce((t, x) => t + x, 0) / hold.length : 0, byS: group(x => x.strategy || ''), byP: group(x => x.pair || '?')}; }

      <div class="card"><h2>Equity <span>${['24h', '7d', 'all'].map(r => `<button class="seg ${rng === r ? 'on' : ''}" data-rng="${r}">${r === 'all' ? 'All' : r}</button>`).join(' ')}</span></h2>${eq ? chart(eq, start) : sk(240)}</div>
      <div class="card"><h2>Open positions</h2><div class="pos">${posH}</div></div>
      <div class="card"><h2>Agent feed <button class="seg ${holds ? 'on' : ''}" id="engHolds">${holds ? 'Hide' : 'Show'} holds${D.dec ? ' (' + nh + ')' : ''}</button></h2><div class="feed">${feed}</div></div>
      <div class="card"><h2>Recent closed trades</h2>${cl ? `<div class="wrap"><table><thead><tr><th>Pair</th><th>Side</th><th>Entry</th><th>Exit</th><th>Result</th><th>How</th><th>Strategy</th><th>Closed</th></tr></thead><tbody>${closedT}</tbody></table></div>` : sk(120)}</div>
    </div><div class="stack side">
      ${controls}
      <div class="card"><h2>Performance</h2>${perf}</div>
      <div class="card"><h2>What the agent is learning</h2>${S ? `<div class="ins">${insights(S, start).map(t => `<div>${t}</div>`).join('')}</div>` : sk(110)}<p class="note">Worked out from the closed trades above. Nothing is changed automatically: you decide which strategies stay on.</p></div>
      ${reviewCard(adm)}
      <div class="card"><h2>Result by strategy</h2>${S ? bars(S.byS, start, sname) : sk(110)}</div>
      <div class="card"><h2>Result by pair</h2>${S ? bars(S.byP, start, k => String(k).replace('USDT', '')) : sk(110)}</div>
    </div></div>
    <p class="note">Paper results do not predict real results. Simulated fills ignore slippage and queue position. This is not financial advice.</p>`; }
document.addEventListener('toggle', ev => { if(ev.target && ev.target.id === 'engSet') setOpen = ev.target.open; }, true);
const markDirty = () => { dirty = true; saveMsg = ''; const m = $('engSaveMsg'); if(m) m.textContent = 'You have unsaved changes.'; };
document.addEventListener('change', ev => { const t = ev.target; if(!W || !t || !t.dataset || !t.dataset.k) return; const k = t.dataset.k; if(k === 'str'){ W.strategies = Array.from(document.querySelectorAll('#engSet [data-k=str]:checked')).map(x => x.value); } else if(k === 'tfa'){ W.tf_allowed = Array.from(document.querySelectorAll('#engSet [data-k=tfa]:checked')).map(x => x.value); } else if(k === 'auto_tf'){ W.auto_tf = t.checked; } else if(['risk_pct', 'max_open', 'max_lev', 'balance', 'scan_top', 'scan_pick'].indexOf(k) >= 0){ W[k] = +t.value; } else { W[k] = t.value; } markDirty(); if(k === 'timeframe' || k === 'auto_tf'){ try{ t.blur(); }catch(e){} paint(); } });
document.addEventListener('input', ev => { const t = ev.target; if(W && t && t.dataset && t.dataset.k && t.type === 'number'){ W[t.dataset.k] = +t.value; markDirty(); } });
document.addEventListener('click', async ev => { const t = ev.target.closest && ev.target.closest('button'); if(!t) return;
  if(t.dataset.rng){ rng = t.dataset.rng; paint(); return; } if(t.id === 'engHolds'){ holds = !holds; paint(); return; }
  if(!D || !D.cfg) return; const say = s => { if($('engMsg')) $('engMsg').textContent = s; };
  if(t.id === 'engTog'){ const r = await A('/rest/v1/ttm_engine_config?id=eq.1', {method: 'PATCH', body: JSON.stringify({enabled: !D.cfg.enabled})}); if(!r.ok) say('Could not save.'); load(); }
  else if(t.id === 'engReview'){ t.disabled = true; const rm = $('engRevMsg'); if(rm) rm.textContent = 'The agent is reviewing its trades. This takes about 20 to 40 seconds\u2026'; try{ const cfg = window.ttmCfg(), tk = await window.ttmWho().token(); const r = await fetch(cfg.url + '/functions/v1/engine-tick', {method: 'POST', headers: {apikey: cfg.key, Authorization: 'Bearer ' + tk, 'Content-Type': 'application/json'}, body: JSON.stringify({action: 'review'})}); const j = await r.json().catch(() => ({})); await load(); const m2 = $('engRevMsg'); if(m2) m2.textContent = j.ok ? 'Review written.' : (j.error || j.reason || 'Problem ' + r.status); }catch(e){ const m2 = $('engRevMsg'); if(m2) m2.textContent = 'Could not reach the function. Redeploy engine-tick.'; } }
  else if(t.dataset.sug){ const g = (D.sug || []).find(x => String(x.id) === t.dataset.sug); if(!g) return; t.disabled = true; let ok = true;
    if(t.dataset.act === 'approve' && g.kind === 'change'){ const body = patchFor(g.change); if(!Object.keys(body).length){ say('That change no longer applies to your current settings, so nothing was changed.'); } else { const r = await A('/rest/v1/ttm_engine_config?id=eq.1', {method: 'PATCH', body: JSON.stringify(body)}); ok = r.ok; } }
    if(ok){ await A('/rest/v1/ttm_engine_suggestions?id=eq.' + g.id, {method: 'PATCH', body: JSON.stringify({status: t.dataset.act === 'approve' ? 'approved' : 'dismissed', decided_at: new Date().toISOString()})}); } else { const m2 = $('engRevMsg'); if(m2) m2.textContent = 'Could not apply that change.'; } load(); }
  else if(t.id === 'engRun'){ t.disabled = true; say('Checking the market and asking the agent. This takes about 10 to 30 seconds…'); try{ const cfg = window.ttmCfg(), tk = await window.ttmWho().token(); const r = await fetch(cfg.url + '/functions/v1/engine-tick', {method: 'POST', headers: {apikey: cfg.key, Authorization: 'Bearer ' + tk, 'Content-Type': 'application/json'}, body: '{}'}); const j = await r.json().catch(() => ({})); say(j.ok ? 'Done.' : j.skipped || ('Problem: ' + (j.error || j.reason || r.status))); }catch(e){ say('Could not reach the function. Is engine-tick deployed?'); } load(); }
  else if(t.id === 'engCopySql'){ const cm = $('engCopyMsg'); try{ const r = await fetch('../supabase/engine_all.sql?v=' + Date.now()); if(!r.ok) throw new Error('missing'); const txt = await r.text(); try{ await navigator.clipboard.writeText(txt); if(cm) cm.textContent = 'Copied. Now paste it into the Supabase SQL Editor and press Run.'; }catch(e2){ const ta = document.createElement('textarea'); ta.value = txt; ta.style.cssText = 'width:100%;height:140px;margin-top:6px'; if(cm){ cm.textContent = 'Select all of this text, copy it, then paste it into Supabase:'; cm.after(ta); ta.focus(); ta.select(); } } }catch(e){ if(cm) cm.innerHTML = 'Could not load the file. Open <a href="https://raw.githubusercontent.com/TTM-TradetheMove/ttm-markets-terminal/main/supabase/engine_all.sql" target="_blank" rel="noopener" style="color:var(--gold2)">this page</a>, select all, copy.'; } }
  else if(t.dataset.set && W){ W[t.dataset.set] = t.dataset.v; markDirty(); paint(); }
  else if(t.dataset.rmpair && W){ W.pairs = W.pairs.filter(x => x !== t.dataset.rmpair); markDirty(); paint(); }
  else if(t.id === 'engAddP' && W){ const inp = $('engAddPair'); let v = String((inp && inp.value) || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); if(!v) return; if(!/USDT$/.test(v)) v += 'USDT'; if(!/^[A-Z0-9]{2,20}USDT$/.test(v)){ const m = $('engSaveMsg'); if(m) m.textContent = 'That does not look like a pair name.'; return; } if(W.pairs.indexOf(v) < 0) W.pairs.push(v); markDirty(); paint(); }
  else if(t.dataset.prop){ t.disabled = true; const pm = $('engPropMsg'); if(t.dataset.act === 'reject'){ await A('/rest/v1/ttm_engine_proposals?id=eq.' + t.dataset.prop, {method: 'PATCH', body: JSON.stringify({status: 'rejected', decided_at: new Date().toISOString(), result: 'Rejected by TTM'})}); load(); }
    else { if(pm) pm.textContent = 'Opening the trade…'; try{ const cfg = window.ttmCfg(), tk = await window.ttmWho().token(); const r = await fetch(cfg.url + '/functions/v1/engine-tick', {method: 'POST', headers: {apikey: cfg.key, Authorization: 'Bearer ' + tk, 'Content-Type': 'application/json'}, body: JSON.stringify({action: 'approve', id: +t.dataset.prop})}); const j = await r.json().catch(() => ({})); await load(); const p2 = $('engPropMsg'); if(p2) p2.textContent = j.ok ? 'Trade opened.' : (j.error || j.reason || 'Problem ' + r.status); }catch(e){ if($('engPropMsg')) $('engPropMsg').textContent = 'Could not reach the function. Redeploy engine-tick.'; load(); } } }
  else if(t.id === 'engSave'){ const sm = m => { saveMsg = m; if($('engSaveMsg')) $('engSaveMsg').textContent = m; }; if(!W) return;
    const pairs = W.pairs.slice(); if(W.pair_mode === 'list' && !pairs.length){ sm('Add at least one pair, or switch to Auto scan.'); return; }
    if(!(W.risk_pct > 0 && W.risk_pct <= 5) || !(W.max_open >= 1) || !(W.max_lev >= 1) || !(W.balance >= 100)){ sm('Check the numbers: risk 0.1 to 5, positions at least 1, leverage at least 1, balance at least 100.'); return; }
    const balChanged = +W.balance !== +D.cfg.start_balance, legacy = {pairs, risk_pct: +W.risk_pct, max_open: +W.max_open, max_lev: +W.max_lev, model: W.model || 'claude-sonnet-5-5'};
    const full = Object.assign({}, legacy, {mode: W.mode, timeframe: W.timeframe, strategies: W.strategies, pair_mode: W.pair_mode, scan_top: +W.scan_top, scan_pick: +W.scan_pick, auto_tf: W.auto_tf, tf_allowed: W.tf_allowed});
    t.disabled = true; sm('Saving…'); let r = await A('/rest/v1/ttm_engine_config?id=eq.1', {method: 'PATCH', body: JSON.stringify(full)});
    if(r.ok){ dirty = false; sm('Saved.'); }
    else { const why = (r.json && (r.json.message || r.json.hint)) || ('error ' + r.status); const r2 = await A('/rest/v1/ttm_engine_config?id=eq.1', {method: 'PATCH', body: JSON.stringify(legacy)});
      if(r2.ok){ sm('Only part of this saved: pairs, risk, positions, leverage, balance and version. NOT saved: mode, time frame, strategies and pair scan, because the database setup is missing (see the yellow box at the top). Your choices stay here until you fix it and press Save again. (' + why + ')'); }
      else { sm('Could not save. ' + why + '. If it mentions a column, use the yellow setup box at the top. If it mentions permission, make sure you are signed in as the admin.'); } }
    if(balChanged){ const rb = await A('/rest/v1/rpc/ttm_engine_set_balance', {method: 'POST', body: JSON.stringify({new_balance: +W.balance})}); let bm = '';
      if(!rb.ok){ const rb2 = await A('/rest/v1/ttm_engine_config?id=eq.1', {method: 'PATCH', body: JSON.stringify({start_balance: +W.balance})}); bm = rb2.ok ? ' The new balance is saved, but the equity line was not re-based because the database setup is missing (use Copy setup SQL).' : ' The starting balance could not be saved.'; }
      if(bm) sm((saveMsg && saveMsg !== 'Saving\u2026' ? saveMsg : 'Saved.') + bm); else if(r.ok) sm('Saved. Equity moved with the new balance, and your result is unchanged.'); }
    t.disabled = false; if(r.ok || balChanged){ const keep = saveMsg; await load(); sm(keep); } }
  else if(t.id === 'engReset'){ if(!t.dataset.sure){ t.dataset.sure = '1'; t.textContent = 'Tap again to delete all paper trades'; setTimeout(() => { if(t.isConnected){ delete t.dataset.sure; t.textContent = 'Reset paper account'; } }, 4000); return; }
    const r = await A('/rest/v1/rpc/ttm_engine_reset', {method: 'POST', body: '{}'}); dirty = false; say(r.ok ? 'Reset. The engine is off.' : 'Could not reset.'); if($('engSaveMsg')) $('engSaveMsg').textContent = r.ok ? 'Reset. The engine is off.' : 'Could not reset.'; load(); } });
window.addEventListener('ttm-hide', paint);
{ const cd = cacheGet(); if(cd && localStorage.getItem('ttm_auth_v1')){ D = cd; setTimeout(paint, 0); } }
let tries = 0; const boot = setInterval(() => { const w = window.ttmWho ? window.ttmWho() : null; if(w && w.ready){ clearInterval(boot); if(w.user && w.tester) load(); else paint(); } else if(++tries > 120){ clearInterval(boot); paint(); } }, 100);
setInterval(() => { const w = window.ttmWho ? window.ttmWho() : null; if(w && w.user && w.tester && !document.hidden) load(); }, 30000);
})();
