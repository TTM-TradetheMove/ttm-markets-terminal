<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="../favicon.png"><title>TTM Agent Console</title>
<style>
:root{--bg:#070a11;--card:#0f1521;--card2:#141c2b;--line:#212b3d;--text:#e9ecf3;--mute:#8993a8;--gold:#f2b632;--gold2:#ffd36b;--g:#34d399;--r:#f87171;--b:#60a5fa}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 500px at 70% -10%,#16213a 0,transparent 60%),var(--bg);color:var(--text);font:14.5px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:rgba(7,10,17,.7);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
header a.back{color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:190px}.logo{width:36px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--gold),#b97a0c);display:grid;place-items:center;color:#14100a;font-weight:900;font-size:11px;letter-spacing:.02em}
.brand b{font-size:15px;letter-spacing:.02em}.brand small{display:block;color:var(--mute);font-size:11.5px;margin-top:-2px}
.acct-btn{background:transparent;border:1px solid var(--gold);color:var(--gold2);padding:7px 12px;border-radius:999px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:1240px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 70px;display:flex;flex-direction:column;gap:14px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
h1{font-size:22px;margin:0 0 4px}h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:0 0 12px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
p.note{color:var(--mute);font-size:13px;margin:6px 0 0}.g{color:var(--g)}.r{color:var(--r)}.m{color:var(--mute)}
.status{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.dot{width:9px;height:9px;border-radius:50%;background:var(--r)}.dot.on{background:var(--g);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pu 2s infinite}@keyframes pu{70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.chip{display:inline-block;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--mute);white-space:nowrap}.chip.gold{color:var(--gold2);border-color:rgba(242,182,50,.45);background:rgba(242,182,50,.08)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;border:1px solid var(--line)}.pill.on{color:var(--g);border-color:var(--g)}.pill.offp{color:var(--r);border-color:var(--r)}
button.btn{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#14100a;border:0;border-radius:10px;padding:9px 15px;font:inherit;font-weight:800;cursor:pointer}button.btn.ghost{background:rgba(255,255,255,.04);color:var(--text);border:1px solid var(--line);font-weight:600}button.btn.off{background:var(--r);color:#fff}button.btn[disabled]{opacity:.5;cursor:default}button.seg{background:transparent;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}button.seg.on{color:#14100a;background:var(--gold);border-color:var(--gold);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}.kpi small{color:var(--mute);font-size:12px}.kpi strong{font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}.kpi em{font-style:normal;font-size:12px;color:var(--mute)}.kpi svg{position:absolute;right:10px;bottom:10px;opacity:.9}
.cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px;align-items:start}.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.pos{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}.pc{border:1px solid var(--line);border-radius:12px;padding:12px;background:rgba(255,255,255,.02);position:relative}.pc:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--c)}
.pc .t{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.pc .lv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;color:var(--mute)}.pc .lv b{display:block;color:var(--text);font-size:13.5px;font-variant-numeric:tabular-nums}
.feed{display:flex;flex-direction:column;gap:8px;max-height:560px;overflow:auto}.ev{border-left:3px solid var(--c);background:rgba(255,255,255,.025);border-radius:0 10px 10px 0;padding:8px 12px}.ev .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}.ev .h i{font-style:normal;color:var(--mute);font-size:11.5px;margin-left:auto}.ev .why{color:var(--mute);font-size:13px;margin-top:3px}
.rows{display:flex;flex-direction:column}.rw{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}.rw:last-child{border-bottom:0}.rw span:first-child{color:var(--mute)}.rw b{font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:10px}.br .l{display:flex;justify-content:space-between;font-size:13px;gap:8px}.br .l span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.br .l small{color:var(--mute)}.tr{height:6px;border-radius:6px;background:rgba(255,255,255,.07);margin-top:5px;overflow:hidden}.tr i{display:block;height:100%;border-radius:6px}
.ins{display:flex;flex-direction:column;gap:8px}.ins div{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13.5px;background:rgba(242,182,50,.05)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mute);font-weight:600;font-size:11.5px}.wrap{overflow-x:auto}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}.form input,.form select{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 10px;font:inherit}
details>summary{cursor:pointer;list-style:none;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}details>summary::-webkit-details-marker{display:none}
.eye-btn{background:transparent;border:1px solid var(--line);color:var(--mute);width:34px;height:34px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}.eye-btn.on{color:var(--gold2);border-color:var(--gold)}
.warn{border:1px solid var(--gold);background:rgba(242,182,50,.08);border-radius:10px;padding:10px 12px;font-size:13.5px}
.sk{border-radius:10px;background:linear-gradient(90deg,#141c2b 25%,#1b2539 50%,#141c2b 75%);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
.hide-usd .form input.mny{filter:blur(7px)}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.kpi strong{font-size:22px}}
</style></head>
<body data-terminal="engine">
<header><a class="back" href="../index.html">&larr; Terminal</a><div class="brand"><div class="logo">TTM</div><div><b>TTM Agent Console</b><small>Automated trading engine &middot; paper trading</small></div></div><button type="button" class="acct-btn" id="acctBtn">Sign in</button></header>
<main id="app"><div class="kpis"><div class="card sk" style="height:96px"></div><div class="card sk" style="height:96px"></div><div class="card sk" style="height:96px"></div><div class="card sk" style="height:96px"></div></div><div class="card sk" style="height:300px"></div></main>
<script src="../accounts.js"></script>
<script>
(function(){
const $ = id => document.getElementById(id), esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const app = $('app'); let D = null, busy = false, rng = 'all', holds = false, setOpen = false;
const hid = () => !!(window.ttmHid && window.ttmHid());
const usd = (v, sb, plus) => { if(hid()){ if(!(sb > 0)) return '•••'; const p = v / sb * 100; return (plus && p > 0 ? '+' : '') + p.toFixed(Math.abs(p) >= 10 ? 1 : 2) + '%'; } return (v < 0 ? '-' : plus && v > 0 ? '+' : '') + '$' + Math.abs(v).toLocaleString(undefined, {maximumFractionDigits: Math.abs(v) < 100 ? 2 : 0}); };
const px = v => v == null ? '' : v >= 1000 ? Number(v).toLocaleString(undefined, {maximumFractionDigits: 1}) : v >= 1 ? Number(v).toFixed(3) : Number(v).toPrecision(4);
const ago = t => { if(!t) return 'never'; const m = Math.round((Date.now() - new Date(t).getTime()) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago'; };
const dur = ms => { const h = ms / 3600000; return h < 1 ? Math.round(h * 60) + ' min' : h < 48 ? h.toFixed(1) + ' h' : (h / 24).toFixed(1) + ' d'; };
const A = (p, o) => window.ttmApi(p, o);
const TFL = [['5m', '5min', 288], ['15m', '15min', 96], ['30m', '30min', 48], ['1H', '1hr', 24], ['2H', '2hr', 12], ['4H', '4hr', 6], ['8H', '8hr', 3], ['12H', '12hr', 2], ['1D', 'daily', 1], ['3D', '3day', 0.33], ['1W', 'weekly', 0.14]];
const STR = [['trend', 'Trend continuation', 'Trades pullbacks in established trends, filtered by the higher time frame.'], ['breakout', 'Breakout and retest', 'Waits for a confirmed breakout of support or resistance, then a retest.'], ['sweep', 'Liquidity sweep and reversal', 'High priority. Price takes a high or low, rejects, and the agent trades the reversal.'], ['momentum', 'Momentum expansion', 'Rising volume and volatility, strong moves, trailing exits.']];
const MODELS = [['claude-sonnet-5-5', 'TTM Agent · Standard'], ['claude-haiku-5-5', 'TTM Agent · Lite (cheapest)'], ['claude-opus-5-5', 'TTM Agent · Max (most careful, costs most)']];
const sname = k => k ? (STR.find(x => x[0] === k) || [0, k])[1] : 'Before strategies';
// two stage load: configuration and open trades first (the top of the page shows quickly), then the history
async function load(){ if(busy) return; busy = true; try{
  const [c, o] = await Promise.all([A('/rest/v1/ttm_engine_config?select=*&id=eq.1'), A('/rest/v1/ttm_engine_positions?select=*&status=eq.open&order=opened_at.desc')]);
  if(!c.ok){ D = {missing: true}; busy = false; paint(); return; }
  D = Object.assign(D && D.cfg ? D : {closed: null, dec: null, eq: null}, {cfg: (c.json || [])[0], open: o.json || []}); paint();
  const [cl, d, e] = await Promise.all([A('/rest/v1/ttm_engine_positions?select=*&status=eq.closed&order=closed_at.desc&limit=200'), A('/rest/v1/ttm_engine_decisions?select=*&order=ts.desc&limit=80'), A('/rest/v1/ttm_engine_equity?select=ts,equity&order=ts.desc&limit=600')]);
  D.closed = cl.json || []; D.dec = d.json || []; D.eq = (e.json || []).slice().reverse(); }catch(err){ D = D && D.cfg ? D : {missing: true}; } busy = false; paint(); }
function locked(msg){ app.innerHTML = `<div class="card"><h1>TTM Agent Console</h1><p>${msg}</p><p class="note">Early access is for TTM and testers only while it is built.</p><p><a class="btn" style="display:inline-block;text-decoration:none;background:var(--gold);color:#14100a;border-radius:10px;padding:9px 14px;font-weight:800" href="../index.html">Back to the terminal</a></p></div>`; }
function spark(eq, col){ const a = eq.slice(-40).map(p => +p.equity); if(a.length < 2) return ''; const lo = Math.min(...a), hi = Math.max(...a), W = 74, H = 28; return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" points="${a.map((v, i) => (i / (a.length - 1) * W).toFixed(1) + ',' + (H - 3 - (v - lo) / (hi - lo || 1) * (H - 6)).toFixed(1)).join(' ')}"/></svg>`; }
function ring(p, col){ const R = 17, C = 2 * Math.PI * R; return `<svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="${R}" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="5"/><circle cx="23" cy="23" r="${R}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(C * p / 100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 23 23)"/></svg>`; }
function chart(all, start){ let eq = all; const now = Date.now(); if(rng !== 'all'){ const lim = now - (rng === '24h' ? 86400000 : 7 * 86400000); eq = all.filter(p => new Date(p.ts).getTime() >= lim); }
  if(eq.length < 2) return '<p class="note">The equity line appears once the agent has made a couple of checks in this range.</p>';
  const W = 760, H = 250, L = 58, R = 14, T = 12, B = 24, pct = hid(), val = v => pct ? (start > 0 ? (v / start - 1) * 100 : 0) : v, ys = eq.map(p => val(+p.equity)), lo = Math.min(...ys, val(start)), hi = Math.max(...ys, val(start)), pad = (hi - lo || 1) * .12;
  const t0 = new Date(eq[0].ts).getTime(), t1 = new Date(eq[eq.length - 1].ts).getTime() || t0 + 1, X = t => L + (t - t0) / (t1 - t0 || 1) * (W - L - R), Y = v => T + (1 - (v - (lo - pad)) / (hi - lo + 2 * pad)) * (H - T - B), fm = v => pct ? (v > 0 ? '+' : '') + v.toFixed(1) + '%' : '$' + Math.round(v).toLocaleString();
  const path = eq.map((p, i) => (i ? 'L' : 'M') + X(new Date(p.ts).getTime()).toFixed(1) + ' ' + Y(val(+p.equity)).toFixed(1)).join(' '), up = +eq[eq.length - 1].equity >= start, col = up ? '#34d399' : '#f87171', by = Y(val(start));
  let g = `<defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>`;
  g += [0, .5, 1].map(f => { const v = lo + (hi - lo) * f, y = Y(v); return `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.07)"/><text x="${L - 6}" y="${y + 4}" font-size="10.5" fill="#8993a8" text-anchor="end">${fm(v)}</text>`; }).join('');
  g += `<line x1="${L}" x2="${W - R}" y1="${by}" y2="${by}" stroke="#f2b632" stroke-dasharray="4 4" opacity=".6"/><path d="${path} L${X(t1)} ${H - B} L${X(t0)} ${H - B} Z" fill="url(#gr)"/><path d="${path}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round"/><circle cx="${X(t1)}" cy="${Y(val(+eq[eq.length - 1].equity))}" r="4.5" fill="${col}"/>`;
  const fd = t => new Date(t).toLocaleDateString(undefined, {day: 'numeric', month: 'short'}) + (rng === '24h' ? ' ' + new Date(t).toLocaleTimeString(undefined, {hour: '2-digit', minute: '2-digit'}) : ''); g += `<text x="${L}" y="${H - 6}" font-size="10.5" fill="#8993a8">${fd(t0)}</text><text x="${W - R}" y="${H - 6}" font-size="10.5" fill="#8993a8" text-anchor="end">${fd(t1)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}</svg>`; }
function stats(cl){ const n = cl.length, wins = cl.filter(x => +x.pnl > 0), loss = cl.filter(x => +x.pnl < 0), gw = wins.reduce((t, x) => t + +x.pnl, 0), gl = Math.abs(loss.reduce((t, x) => t + +x.pnl, 0));
  const hold = cl.filter(x => x.opened_at && x.closed_at).map(x => new Date(x.closed_at) - new Date(x.opened_at)), group = f => { const m = {}; cl.forEach(x => { const k = f(x); (m[k] = m[k] || []).push(x); }); return Object.keys(m).map(k => { const a = m[k], w = a.filter(x => +x.pnl > 0).length, pnl = a.reduce((t, x) => t + +x.pnl, 0), r = a.filter(x => +x.risk_usd > 0).map(x => +x.pnl / +x.risk_usd); return {k, n: a.length, w, pnl, wr: w / a.length * 100, avgR: r.length ? r.reduce((t, x) => t + x, 0) / r.length : null}; }).sort((a, b) => b.pnl - a.pnl); };
  return {n, w: wins.length, l: loss.length, wr: n ? wins.length / n * 100 : 0, pf: gl ? gw / gl : (gw ? 99 : 0), avgW: wins.length ? gw / wins.length : 0, avgL: loss.length ? -gl / loss.length : 0, best: n ? Math.max(...cl.map(x => +x.pnl)) : 0, worst: n ? Math.min(...cl.map(x => +x.pnl)) : 0, hold: hold.length ? hold.reduce((t, x) => t + x, 0) / hold.length : 0, byS: group(x => x.strategy || ''), byP: group(x => x.pair || '?')}; }
function bars(list, start, label){ if(!list.length) return '<p class="note">Nothing to show yet.</p>'; const mx = Math.max(...list.map(x => Math.abs(x.pnl)), 1e-9); return `<div class="bars">${list.slice(0, 8).map(x => `<div class="br"><div class="l"><span>${esc(label(x.k))}</span><span class="${x.pnl >= 0 ? 'g' : 'r'}"><b>${usd(x.pnl, start, true)}</b> <small>${x.w}/${x.n} won${x.avgR != null ? ' · ' + x.avgR.toFixed(2) + 'R' : ''}</small></span></div><div class="tr"><i style="width:${Math.max(4, Math.abs(x.pnl) / mx * 100).toFixed(0)}%;background:${x.pnl >= 0 ? 'var(--g)' : 'var(--r)'}"></i></div></div>`).join('')}</div>`; }
function insights(S, start){ const out = []; if(S.n < 5) return ['Not enough closed trades yet to learn from (' + S.n + ' so far). The notes below appear after about 5 trades.']; const b = S.byS.filter(x => x.n >= 2);
  if(b.length){ const top = b[0], bot = b[b.length - 1]; out.push(`Best strategy so far: <b>${esc(sname(top.k))}</b> (${top.w} of ${top.n} won, ${usd(top.pnl, start, true)}).`); if(b.length > 1 && bot.pnl < 0) out.push(`Weakest: <b>${esc(sname(bot.k))}</b> (${bot.w} of ${bot.n} won, ${usd(bot.pnl, start, true)}). Worth switching off or tightening.`); }
  const p = S.byP.filter(x => x.n >= 2); if(p.length > 1 && p[p.length - 1].pnl < 0) out.push(`Weakest pair: <b>${esc(p[p.length - 1].k)}</b> (${usd(p[p.length - 1].pnl, start, true)} over ${p[p.length - 1].n} trades).`);
  if(S.avgW && S.avgL && Math.abs(S.avgL) > S.avgW && S.wr < 60) out.push('Average loss is bigger than the average win, so it needs a higher win rate to pay. Consider tighter stops or higher targets.');
  if(S.pf >= 1.5) out.push(`Profit factor ${S.pf.toFixed(2)}: winners are paying for losers well so far. A small sample, so keep testing.`); else if(S.pf < 1) out.push(`Profit factor ${S.pf.toFixed(2)}: losing more than winning so far.`);
  return out.length ? out : ['No clear pattern yet.']; }
function paint(){
  const who = window.ttmWho ? window.ttmWho() : {user: false, ready: false};
  if(!who.ready && !D){ return; }
  if(!who.user){ locked('Sign in with your TTM account to continue.'); return; }
  if(!who.tester){ locked('The engine is locked for your account.'); return; }
  if(!D){ return; }
  if(D.missing){ app.innerHTML = '<div class="card"><h1>One setup step is missing</h1><p>Run <b>supabase/engine.sql</b> in the Supabase SQL editor, then refresh this page.</p></div>'; return; }
  const ae = document.activeElement; if(ae && ae.closest && ae.closest('#engSet') && /INPUT|SELECT/.test(ae.tagName)) return;   // do not redraw while typing in settings
  const c = D.cfg, adm = who.admin, start = +c.start_balance, eq = D.eq, cl = D.closed, S = cl ? stats(cl) : null, cur = eq && eq.length ? +eq[eq.length - 1].equity : start;
  const TFo = TFL.find(x => x[0] === (c.timeframe || '1H')) || TFL[3], tfk = TFo[0], strOn = Array.isArray(c.strategies) ? c.strategies : ['trend', 'breakout', 'sweep', 'momentum'], mval = c.model || 'claude-sonnet-5-5';
  const ts = new Date(c.last_tick).getTime(), stale = c.enabled && (!c.last_tick || Date.now() - ts > 3 * 3600000), res = cur - start, col = res >= 0 ? '#34d399' : '#f87171';
  let dd = 0; if(eq){ let peak = start; eq.forEach(p => { peak = Math.max(peak, +p.equity); dd = Math.max(dd, peak - +p.equity); }); }
  const sk = h => `<div class="sk" style="height:${h}px"></div>`;
  const kpi = (k, v, sub, extra) => `<div class="card kpi"><small>${k}</small><strong>${v}</strong><em>${sub || ''}</em>${extra || ''}</div>`;
  const hero = `<div class="kpis">${kpi('Equity', hid() ? '•••••' : usd(cur, start), 'Started ' + usd(start, start), eq ? spark(eq, col) : '')}${kpi('Result since start', `<span class="${res >= 0 ? 'g' : 'r'}">${usd(res, start, true)}</span>`, (start > 0 ? ((res / start) * 100).toFixed(2) + '%' : ''))}${kpi('Win rate', S ? (S.n ? Math.round(S.wr) + '%' : '—') : '…', S ? S.w + ' won · ' + S.l + ' lost' : '', S && S.n ? ring(S.wr, '#34d399') : '')}${kpi('Open positions', D.open.length, 'Max drawdown ' + (dd ? usd(-dd, start) : '—'))}</div>`;
  const posH = D.open.map(p => { const sd = Math.abs(+p.entry - +p.sl) / +p.entry * 100, rr = p.tp != null ? Math.abs(+p.tp - +p.entry) / Math.abs(+p.entry - +p.sl) : null; return `<div class="pc" style="--c:${p.side === 'long' ? 'var(--g)' : 'var(--r)'}"><div class="t"><span><b>${esc(String(p.pair).replace('USDT', ''))}</b> <span class="${p.side === 'long' ? 'g' : 'r'}"><b>${p.side.toUpperCase()}</b></span> <span class="m">${p.lev}×</span></span><span class="m" style="font-size:12px">${ago(p.opened_at)}</span></div><div class="lv"><span>Entry<b>${px(+p.entry)}</b></span><span>Stop<b>${px(+p.sl)}</b></span><span>Target<b>${p.tp == null ? '—' : px(+p.tp)}</b></span></div><div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><span class="chip gold">${esc(sname(p.strategy || null) === 'Before strategies' ? 'Manual rules' : sname(p.strategy))}</span><span class="chip">Risk ${usd(+p.risk_usd, start)} · stop ${sd.toFixed(1)}%${rr ? ' · ' + rr.toFixed(1) + 'R' : ''}${p.trail_atr ? ' · trailing' : ''}</span></div></div>`; }).join('') || '<p class="note">No open positions. The agent only trades clear setups, so quiet stretches are normal.</p>';
  const evs = D.dec ? D.dec.filter(d => holds || d.action !== 'hold') : null, nh = D.dec ? D.dec.filter(d => d.action === 'hold').length : 0;
  const feed = evs ? (evs.map(d => { const cc = !d.accepted && d.action !== 'hold' ? 'var(--gold)' : d.action === 'open_long' ? 'var(--g)' : d.action === 'open_short' ? 'var(--r)' : d.action === 'close' ? 'var(--b)' : 'var(--line)'; return `<div class="ev" style="--c:${cc}"><div class="h"><b>${esc(String(d.pair || '').replace('USDT', ''))}</b><span>${esc((d.action || '').replace('_', ' '))}</span>${d.strategy ? `<span class="chip gold">${esc(sname(d.strategy))}</span>` : ''}${d.timeframe ? `<span class="chip">${esc(d.timeframe)}</span>` : ''}${d.accepted || d.action === 'hold' ? '' : '<span class="pill offp">rejected: ' + esc(d.reject_reason || '') + '</span>'}<i>${ago(d.ts)}</i></div><div class="why">${esc(d.reason || '')}</div></div>`; }).join('') || `<p class="note">No trades or exits yet. ${nh} hold decisions are hidden.</p>`) : sk(160);
  const closedT = cl ? (cl.slice(0, 12).map(p => `<tr><td><b>${esc(String(p.pair).replace('USDT', ''))}</b></td><td class="${p.side === 'long' ? 'g' : 'r'}">${p.side}</td><td>${px(+p.entry)}</td><td>${px(+p.exit_price)}</td><td class="${+p.pnl >= 0 ? 'g' : 'r'}"><b>${usd(+p.pnl, start, true)}</b></td><td>${esc(p.close_reason || '')}</td><td>${esc(p.strategy ? sname(p.strategy) : '')}</td><td>${ago(p.closed_at)}</td></tr>`).join('') || '<tr><td colspan="8" class="m">No closed trades yet.</td></tr>') : '';
  const perf = S ? `<div class="rows"><div class="rw"><span>Closed trades</span><b>${S.n}</b></div><div class="rw"><span>Profit factor</span><b>${S.n ? S.pf.toFixed(2) : '—'}</b></div><div class="rw"><span>Average win</span><b class="g">${S.w ? usd(S.avgW, start, true) : '—'}</b></div><div class="rw"><span>Average loss</span><b class="r">${S.l ? usd(S.avgL, start) : '—'}</b></div><div class="rw"><span>Best trade</span><b class="g">${S.n ? usd(S.best, start, true) : '—'}</b></div><div class="rw"><span>Worst trade</span><b class="r">${S.n ? usd(S.worst, start) : '—'}</b></div><div class="rw"><span>Average hold</span><b>${S.n ? dur(S.hold) : '—'}</b></div></div>` : sk(190);
  const ctrl = adm ? `<button class="btn ${c.enabled ? 'off' : ''}" id="engTog">${c.enabled ? 'Switch off' : 'Switch on'}</button><button class="btn ghost" id="engRun" ${c.enabled ? '' : 'disabled'}>Check now</button>` : '';
  const settings = adm ? `<details class="card" id="engSet" ${setOpen ? 'open' : ''}><summary>Settings</summary><div style="margin-top:14px"><div class="form"><label>Pairs (comma separated)<input id="eng_pairs" value="${esc((c.pairs || []).join(', '))}"></label><label>Risk per trade (% of equity)<input id="eng_risk" type="number" step="0.1" min="0.1" max="5" value="${c.risk_pct}"></label><label>Max open positions<input id="eng_open" type="number" min="1" max="10" value="${c.max_open}"></label><label>Max leverage<input id="eng_lev" type="number" step="0.5" min="1" max="10" value="${c.max_lev}"></label><label>Starting balance (US$)<input id="eng_start" class="mny" type="number" min="100" value="${c.start_balance}"></label><label>TTM Agent version<select id="eng_model">${MODELS.map(m => `<option value="${m[0]}" ${m[0] === mval ? 'selected' : ''}>${m[1]}</option>`).join('')}${MODELS.some(m => m[0] === mval) ? '' : `<option value="${esc(mval)}" selected>Custom: ${esc(mval)}</option>`}</select></label><label>Time frame<select id="eng_tf">${TFL.map(x => `<option value="${x[0]}" ${x[0] === tfk ? 'selected' : ''}>${x[1]}</option>`).join('')}</select></label></div>
      <p class="note">On <b>${TFo[1]}</b> the agent is asked about ${TFo[2] >= 1 ? TFo[2] : 'less than 1'} time${TFo[2] === 1 ? '' : 's'} a day. More often costs more AI usage. Open trades have their stops checked every 5 minutes whatever you pick.</p>
      <div style="margin-top:12px"><b>Strategies the agent may use</b>${STR.map(x => `<label style="display:flex;gap:8px;align-items:flex-start;margin:8px 0;cursor:pointer"><input type="checkbox" class="engStr" value="${x[0]}" ${strOn.indexOf(x[0]) >= 0 ? 'checked' : ''} style="margin-top:3px"><span><b>${x[1]}</b><br><small class="m">${x[2]}</small></span></label>`).join('')}</div>
      <div class="bar" style="display:flex;gap:10px;margin-top:12px"><button class="btn" id="engSave">Save settings</button><button class="btn ghost" id="engReset">Reset paper account</button></div><p class="note">Changing the starting balance only applies after a reset. Reset deletes all paper trades, decisions and the equity line, and switches the engine off.</p></div></details>` : '';
  app.innerHTML = `<div class="card"><div class="status"><span class="dot ${c.enabled ? 'on' : ''}"></span><b style="font-size:16px">${c.enabled ? 'Agent is running' : 'Agent is switched off'}</b><span class="chip gold">${TFo[1]} time frame</span><span class="chip">${strOn.length} of 4 strategies on</span><span class="chip">Asked ${c.last_agent ? ago(c.last_agent) : 'never'}</span><span class="chip">Engine ran ${ago(c.last_tick)}</span><span style="flex:1"></span>${ctrl}</div>
    ${c.last_error ? `<div class="warn" style="margin-top:12px"><b>Last check had a problem:</b> ${esc(c.last_error)}</div>` : ''}${stale ? '<div class="warn" style="margin-top:12px">No check in the last 3 hours. The 5 minute schedule may not be set up, or the function is not deployed.</div>' : ''}<p class="note" id="engMsg">TTM's trained agent reads live Bitget prices and decides whether to open, close or hold, using only the strategies you switch on. Orders are simulated: no exchange keys and no real money.</p></div>
    ${hero}
    <div class="cols"><div class="stack">
      <div class="card"><h2>Equity <span>${['24h', '7d', 'all'].map(r => `<button class="seg ${rng === r ? 'on' : ''}" data-rng="${r}">${r === 'all' ? 'All' : r}</button>`).join(' ')}</span></h2>${eq ? chart(eq, start) : sk(240)}</div>
      <div class="card"><h2>Open positions</h2><div class="pos">${posH}</div></div>
      <div class="card"><h2>Agent feed <button class="seg ${holds ? 'on' : ''}" id="engHolds">${holds ? 'Hide' : 'Show'} holds${D.dec ? ' (' + nh + ')' : ''}</button></h2><div class="feed">${feed}</div></div>
      <div class="card"><h2>Recent closed trades</h2>${cl ? `<div class="wrap"><table><thead><tr><th>Pair</th><th>Side</th><th>Entry</th><th>Exit</th><th>Result</th><th>How</th><th>Strategy</th><th>Closed</th></tr></thead><tbody>${closedT}</tbody></table></div>` : sk(120)}</div>
    </div><div class="stack">
      <div class="card"><h2>Performance</h2>${perf}</div>
      <div class="card"><h2>What the agent is learning</h2>${S ? `<div class="ins">${insights(S, start).map(t => `<div>${t}</div>`).join('')}</div>` : sk(110)}<p class="note">Worked out from the closed trades above. Nothing is changed automatically: you decide which strategies stay on.</p></div>
      <div class="card"><h2>Result by strategy</h2>${S ? bars(S.byS, start, sname) : sk(110)}</div>
      <div class="card"><h2>Result by pair</h2>${S ? bars(S.byP, start, k => String(k).replace('USDT', '')) : sk(110)}</div>
    </div></div>
    ${settings}
    <p class="note">Paper results do not predict real results. Simulated fills ignore slippage and queue position. This is not financial advice.</p>`; }
document.addEventListener('toggle', ev => { if(ev.target && ev.target.id === 'engSet') setOpen = ev.target.open; }, true);
document.addEventListener('click', async ev => { const t = ev.target.closest && ev.target.closest('button'); if(!t) return;
  if(t.dataset.rng){ rng = t.dataset.rng; paint(); return; } if(t.id === 'engHolds'){ holds = !holds; paint(); return; }
  if(!D || !D.cfg) return; const say = s => { if($('engMsg')) $('engMsg').textContent = s; };
  if(t.id === 'engTog'){ const r = await A('/rest/v1/ttm_engine_config?id=eq.1', {method: 'PATCH', body: JSON.stringify({enabled: !D.cfg.enabled})}); if(!r.ok) say('Could not save.'); load(); }
  else if(t.id === 'engRun'){ t.disabled = true; say('Checking the market and asking the agent. This takes about 10 to 30 seconds…'); try{ const cfg = window.ttmCfg(), tk = await window.ttmWho().token(); const r = await fetch(cfg.url + '/functions/v1/engine-tick', {method: 'POST', headers: {apikey: cfg.key, Authorization: 'Bearer ' + tk, 'Content-Type': 'application/json'}, body: '{}'}); const j = await r.json().catch(() => ({})); say(j.ok ? 'Done.' : j.skipped || ('Problem: ' + (j.error || j.reason || r.status))); }catch(e){ say('Could not reach the function. Is engine-tick deployed?'); } load(); }
  else if(t.id === 'engSave'){ const body = {pairs: ($('eng_pairs').value || '').split(',').map(x => x.trim().toUpperCase()).filter(Boolean), risk_pct: +$('eng_risk').value, max_open: +$('eng_open').value, max_lev: +$('eng_lev').value, start_balance: +$('eng_start').value, model: $('eng_model').value || 'claude-sonnet-5-5', timeframe: $('eng_tf').value, strategies: Array.from(document.querySelectorAll('.engStr:checked')).map(x => x.value)};
    if(!body.pairs.length || !(body.risk_pct > 0 && body.risk_pct <= 5) || !(body.max_open >= 1) || !(body.max_lev >= 1) || !(body.start_balance >= 100)){ say('Check the settings: risk 0.1 to 5, at least one pair, leverage at least 1.'); return; }
    const r = await A('/rest/v1/ttm_engine_config?id=eq.1', {method: 'PATCH', body: JSON.stringify(body)}); say(r.ok ? 'Saved.' : 'Could not save.'); if(r.ok) document.activeElement.blur(); load(); }
  else if(t.id === 'engReset'){ if(!t.dataset.sure){ t.dataset.sure = '1'; t.textContent = 'Tap again to delete all paper trades'; setTimeout(() => { if(t.isConnected){ delete t.dataset.sure; t.textContent = 'Reset paper account'; } }, 4000); return; }
    const r = await A('/rest/v1/rpc/ttm_engine_reset', {method: 'POST', body: '{}'}); say(r.ok ? 'Reset. The engine is off.' : 'Could not reset.'); load(); } });
window.addEventListener('ttm-hide', paint);
let tries = 0; const boot = setInterval(() => { const w = window.ttmWho ? window.ttmWho() : null; if(w && w.ready){ clearInterval(boot); if(w.user && w.tester) load(); else paint(); } else if(++tries > 40){ clearInterval(boot); paint(); } }, 300);
setInterval(() => { const w = window.ttmWho ? window.ttmWho() : null; if(w && w.user && w.tester && !document.hidden) load(); }, 30000);
})();
</script></body></html>
